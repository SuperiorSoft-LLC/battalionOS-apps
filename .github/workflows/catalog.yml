name: catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet cryptography
      - run: python3 scripts/test_check_catalog.py
      - run: python3 scripts/test_verify_entry.py
      - run: python3 scripts/check_catalog.py catalog.json
  # A PR that adds or bumps an app: verify every new or changed entry end to end (feed, package, size, sha256,
  # minisign signature, manifest) and write the result to the job summary. This job never merges anything.
  verify-entries:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet cryptography
      - name: Catalog on the target branch
        run: git show "origin/${{ github.base_ref }}:catalog.json" > "$RUNNER_TEMP/base-catalog.json" || echo '{"schema":2,"apps":[]}' > "$RUNNER_TEMP/base-catalog.json"
      - name: Verify new and changed entries
        run: |
          set +e
          python3 scripts/verify_entry.py catalog.json --base "$RUNNER_TEMP/base-catalog.json" --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning::A publicKey changed on an existing app. A maintainer must confirm it with the publisher before merging."
            exit 0
          fi
          exit $code
